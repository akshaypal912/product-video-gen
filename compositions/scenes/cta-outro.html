<!DOCTYPE html>
<html
  lang="en"
  data-composition-variables='[
    {
      "id": "headline",
      "type": "string",
      "label": "Headline",
      "default": "Discover. Connect. Convert.",
      "placeholder": "Discover. Connect. Convert."
    },
    {
      "id": "sub",
      "type": "string",
      "label": "Subtext",
      "default": "Tables",
      "placeholder": "Tables"
    },
    {
      "id": "role",
      "type": "string",
      "label": "Narrative role",
      "default": "cta"
    }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cta-outro</title>
  </head>
  <body>
    <template id="cta-outro-template">
      <link rel="stylesheet" href="theme.css" />

      <div
        id="root"
        data-composition-id="cta-outro"
        data-width="1920"
        data-height="1080"
        data-duration="1.6"
      >
        <div id="cta-outro-veil" class="veil" aria-hidden="true"></div>
        <div class="stage">
          <div id="cta-outro-rule" class="rule" aria-hidden="true"></div>
          <p id="cta-outro-kicker" class="kicker">Next</p>
          <h1
            id="cta-outro-headline"
            class="headline"
            data-var-text="headline"
          >
            Discover. Connect. Convert.
          </h1>
          <p id="cta-outro-sub" class="sub" data-var-text="sub">Tables</p>
        </div>
      </div>

      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: var(--color-background);
          font-family: var(--font-display);
          color: var(--color-text-primary);
        }

        .veil {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            180deg,
            transparent 28%,
            var(--color-accent-soft) 100%
          );
        }

        .stage {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 520px;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-end;
          gap: 22px;
          padding: 0 180px 120px;
          box-sizing: border-box;
        }

        .rule {
          width: 56px;
          height: 2px;
          background: var(--color-accent);
          transform-origin: left center;
        }

        .kicker {
          margin: 0;
          font-family: var(--font-mono);
          font-size: 16px;
          letter-spacing: 0.34em;
          text-transform: uppercase;
          color: var(--color-accent);
        }

        .headline {
          margin: 0;
          max-width: 1560px;
          font-size: 76px;
          font-weight: 700;
          line-height: 1.08;
          letter-spacing: -0.04em;
        }

        .sub {
          margin: 0;
          font-family: var(--font-mono);
          font-size: 22px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--color-text-muted);
        }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(
            "#cta-outro-veil",
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "sine.out" },
            0,
          );

          tl.fromTo(
            "#cta-outro-rule",
            { opacity: 0, scaleX: 0.2 },
            { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" },
            0.1,
          );

          tl.fromTo(
            "#cta-outro-kicker",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
            0.16,
          );

          tl.fromTo(
            "#cta-outro-headline",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            0.22,
          );

          tl.fromTo(
            "#cta-outro-sub",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
            0.48,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["cta-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
