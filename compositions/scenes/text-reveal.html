<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {
      &quot;id&quot;: &quot;lines&quot;,
      &quot;type&quot;: &quot;string&quot;,
      &quot;label&quot;: &quot;Lines (JSON array)&quot;,
      &quot;default&quot;: &quot;[\&quot;Your next customer is already out there.\&quot;, \&quot;They just have not found you yet.\&quot;]&quot;,
      &quot;placeholder&quot;: &quot;[\&quot;Line one.\&quot;, \&quot;Line two.\&quot;]&quot;
    },
    {
      &quot;id&quot;: &quot;role&quot;,
      &quot;type&quot;: &quot;string&quot;,
      &quot;label&quot;: &quot;Narrative role&quot;,
      &quot;default&quot;: &quot;hook&quot;
    }
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-reveal</title>
  </head>
  <body>
    <template id="text-reveal-template">
      <link rel="stylesheet" href="theme.css">

      <div data-hf-id="hf-umjd" id="root" data-composition-id="text-reveal" data-width="1920" data-height="1080" data-duration="2.2">
        <div data-hf-id="hf-t66x" class="bg-veil" aria-hidden="true"></div>
        <div data-hf-id="hf-tan6" class="stage">
          <p data-hf-id="hf-kck1" id="text-reveal-kicker" class="kicker">Why now</p>
          <div data-hf-id="hf-yq05" id="text-reveal-rule" class="rule" aria-hidden="true"></div>
          <div data-hf-id="hf-0beb" id="text-reveal-stage" class="copy"></div>
        </div>
      </div>

      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: var(--color-background);
          font-family: var(--font-display);
          color: var(--color-text-primary);
        }

        .bg-veil {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            900px 520px at 18% 42%,
            var(--color-accent-soft),
            transparent 70%
          );
        }

        .stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 180px 0 200px;
          box-sizing: border-box;
        }

        .kicker {
          margin: 0 0 22px;
          font-family: var(--font-mono);
          font-size: 16px;
          letter-spacing: 0.3em;
          text-transform: uppercase;
          color: var(--color-accent);
        }

        .rule {
          width: 48px;
          height: 2px;
          margin-bottom: 28px;
          background: var(--color-accent);
          transform-origin: left center;
        }

        .copy {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 22px;
          max-width: 1480px;
        }

        .reveal-line {
          margin: 0;
          max-width: 1400px;
        }

        .reveal-line.is-lead {
          font-size: 80px;
          font-weight: 700;
          line-height: 1.06;
          letter-spacing: -0.04em;
        }

        .reveal-line.is-support {
          font-size: 30px;
          font-weight: 400;
          line-height: 1.35;
          color: var(--color-text-muted);
          letter-spacing: -0.01em;
          max-width: 920px;
        }

        #root.role-friction .bg-veil {
          background: radial-gradient(
            820px 480px at 82% 58%,
            rgba(239, 108, 77, 0.14),
            transparent 72%
          );
        }

        #root.role-friction .stage {
          padding: 0 200px 0 240px;
        }

        #root.role-friction .rule {
          width: 2px;
          height: 72px;
          margin-bottom: 24px;
          transform-origin: center top;
        }

        #root.role-friction .reveal-line.is-lead {
          font-size: 68px;
          max-width: 1280px;
        }

        #root.role-benefit .stage,
        #root.role-reveal .stage {
          padding: 0 220px;
        }

        #root.role-benefit .reveal-line.is-lead,
        #root.role-reveal .reveal-line.is-lead {
          font-size: 76px;
        }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          const FALLBACK_LINES = [
            "Your next customer is already out there.",
            "They just have not found you yet.",
          ];
          const KICKERS = {
            hook: "Why now",
            friction: "Friction",
            problem: "Friction",
            reveal: "Product",
            benefit: "Outcome",
            proof: "Proof",
            ecosystem: "Together",
            cta: "Next",
            close: "Next",
          };

          function parseLines(raw) {
            if (Array.isArray(raw)) {
              return raw.map((item) => String(item)).filter((s) => s.length > 0);
            }
            if (typeof raw === "string") {
              const trimmed = raw.trim();
              if (!trimmed) return [];
              try {
                const parsed = JSON.parse(trimmed);
                if (Array.isArray(parsed)) {
                  return parsed
                    .map((item) => String(item))
                    .filter((s) => s.length > 0);
                }
              } catch (_err) {}
              return [trimmed];
            }
            return [];
          }

          function readVars() {
            let raw = FALLBACK_LINES;
            let role = "hook";
            try {
              if (
                window.__hyperframes &&
                typeof window.__hyperframes.getVariables === "function"
              ) {
                const vars = window.__hyperframes.getVariables();
                if (vars && vars.lines != null) raw = vars.lines;
                if (vars && vars.role) role = String(vars.role).trim().toLowerCase();
              }
            } catch (_err) {}
            const lines = parseLines(raw);
            return {
              lines: lines.length > 0 ? lines : FALLBACK_LINES.slice(),
              role: role === "problem" ? "friction" : role,
            };
          }

          const vars = readVars();
          const root = document.getElementById("root");
          if (root && vars.role) root.classList.add("role-" + vars.role);

          const kicker = document.getElementById("text-reveal-kicker");
          if (kicker) kicker.textContent = KICKERS[vars.role] || "Why now";

          const lines = vars.lines.slice(0, 3);
          const stage = document.getElementById("text-reveal-stage");
          const lineEls = [];
          const isFriction = vars.role === "friction";

          lines.forEach((text, index) => {
            const el = document.createElement("p");
            el.className =
              "reveal-line " + (index === 0 ? "is-lead" : "is-support");
            el.id = "text-reveal-line-" + index;
            el.textContent = text;
            stage.appendChild(el);
            lineEls.push(el);
          });

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(
            "#text-reveal-kicker",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
            0.06,
          );
          tl.fromTo(
            "#text-reveal-rule",
            isFriction
              ? { opacity: 0, scaleY: 0.2 }
              : { opacity: 0, scaleX: 0.2 },
            isFriction
              ? { opacity: 1, scaleY: 1, duration: 0.4, ease: "power2.out" }
              : { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" },
            0.1,
          );

          lineEls.forEach((el, index) => {
            const from = isFriction
              ? { opacity: 0, x: index === 0 ? -40 : -18 }
              : { opacity: 0, y: index === 0 ? 36 : 18 };
            const to = isFriction
              ? {
                  opacity: 1,
                  x: 0,
                  duration: index === 0 ? 0.65 : 0.45,
                  ease: "power3.out",
                }
              : {
                  opacity: 1,
                  y: 0,
                  duration: index === 0 ? 0.7 : 0.5,
                  ease: "power3.out",
                };
            tl.fromTo(el, from, to, 0.2 + index * 0.28);
          });

          window.__timelines = window.__timelines || {};
          window.__timelines["text-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
